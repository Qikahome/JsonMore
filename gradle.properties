# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range
minecraft_version_range=[26,)
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.99
# The NeoForge version range
neo_version_range=[26.1.2,)
# The loader version range (FML)
loader_version_range=[4,)


## Mod Properties

# 模组独一无二的标识符。 必须符合正则 [a-z][a-z0-9_]{1,63} 。
mod_id=jsonmore
# 显示名称
mod_name=Json More
# 模组的许可证
mod_license=MIT
# 模组版本
mod_version=1.2.11
# 模组的分组 ID
mod_group_id=qikahome.jsonmore
# 模组的作者
mod_authors=Qikahome
# 模组的描述
mod_description=More things in JSON sauce.


# 前置模组的版本信息
json_things_version=0.18.5
json_things_range=[0.18.5,)
# JEI
jei_version=29.33.0.87
jei_range=[29.0.0,)
