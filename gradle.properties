# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# Fabric 侧：MC 版本 + loader / fabric-api / Porting Lib
# loader / fabric-api 高于 JsonThings-Fabric-1.20.1 的 0.17.2 / 0.92.6：JEI 15.58 硬性要求
# loader >=0.19.4、fabric-api >=0.92.11+1.20.1（Fabric API 同 MC 版本内向下兼容）
minecraft_version=1.20.1
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
# Porting Lib 1.20.1 稳定线（2.3.x）：仅编译期 classpath；运行时由 JsonThings-Fabric jar-in-jar 内嵌提供
# 注意 2.3.x 不提供 DeferredRegister（只有 porting_lib.util.RegistryObject），注册用本仓库自带的极简实现
porting_lib_version=2.3.13+1.20.1
# loom 版本写死在 build.gradle（插件版本必须是字面量）。
# 1.17.+：被 AutoSizedGUI-1.20.1-fabric（Loom 1.13.6）与 JEI 15.58（Loom 1.17.20）的产出方版本号顶上去的，
# 配套 Gradle 9.7.1（wrapper）与 Gradle 守护进程 Java 21。
# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/


## Mod Properties

# 模组独一无二的标识符。 必须符合正则 [a-z][a-z0-9_]{1,63} 。
mod_id=jsonmore
# 显示名称
mod_name=Json More
# 模组的许可证
mod_license=MIT
# 模组版本
mod_version=1.2.12
# 模组的分组 ID
mod_group_id=qikahome.jsonmore
# 模组的作者
mod_authors=Qikahome
# 模组的描述
mod_description=More things in JSON sauce.


## 前置模组

# JsonThings-Fabric（坐标 qikahome:JsonThings-1.20.1-fabric），jar-in-jar 内嵌
# 其 jar 内已 include FabricatedForgeFluid 与 base/common/models/tool_actions/transfer 等 Porting Lib 模块
json_things_version=0.9.13+patch.5

# AutoSizedGUI（坐标 qikahome:AutoSizedGUI-1.20.1-fabric，与 1.21.1 同套多模块结构），jar-in-jar 内嵌
autosizedgui_version=1.1.1

# 可选联动模组（CurseForge maven，值为 Curse 文件 ID）
# JEI 15.58.0.209（1.20.1 Fabric）
jei_cf_file=8820519
# CyclopsCore：1.20.1 无 Fabric 版，不接入
# Create / Anvil MusBox / 暮色森林：本次不接入


## Version Ranges（展开进 fabric.mod.json）
minecraft_version_range=>=1.20.1 <1.20.2
fabric_loader_version_range=>=0.16.0
fabric_api_version_range=*
# 必需前置（jar-in-jar 内嵌，故一定存在）
json_things_range=>=0.9.13
# AutoSizedGUI 自研库版本形如 1.1.0d，不是合法 SemVer，Fabric 无法比较 → 只能放行任意版本
autosizedgui_range=*
# 可选联动（写入 fabric.mod.json 的 recommends）
jei_range=*
