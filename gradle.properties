# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# Fabric 侧：MC 版本 + loader / fabric-api / Porting Lib（与 JsonThings-Fabric-1.21.1 对齐）
minecraft_version=1.21.1
fabric_loader_version=0.17.2
fabric_api_version=0.116.14+1.21.1
# Porting Lib 1.21.1 只有 beta 线（3.1.0-beta.x），发布在 devos snapshots 仓库
# 仅提供编译期 classpath；运行时由 JsonThings-Fabric jar-in-jar 内嵌提供
porting_lib_version=3.1.0-beta.90+1.21.1
# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/


## Mod Properties

# 模组独一无二的标识符。 必须符合正则 [a-z][a-z0-9_]{1,63} 。
mod_id=jsonmore
# 显示名称
mod_name=Json More
# 模组的许可证
mod_license=MIT
# 模组版本
mod_version=1.2.12
# 模组的分组 ID
mod_group_id=qikahome.jsonmore
# 模组的作者
mod_authors=Qikahome
# 模组的描述
mod_description=More things in JSON sauce.


## 前置模组

# JsonThings-Fabric（坐标 qikahome:JsonThings-1.21.1-fabric），jar-in-jar 内嵌
json_things_version=0.13.7+patch.5

# AutoSizedGUI（坐标 qikahome:AutoSizedGUI-1.21.1-fabric），自有库，jar-in-jar 内嵌
autosizedgui_version=1.1.1

# 可选联动模组（CurseForge maven，值为 Curse 文件 ID）
# JEI（jei-1.21.1-fabric-19.53.0.426.jar）
jei_cf_file=8829739
# CyclopsCore（1.21+ 有 Fabric 版）
cyclopscore_cf_file=8831959
# 暮色森林（Twilight Forest）：1.21.1 的 Fabric 版目前只有 Beta（twilightforest-fabric-1.21.1-4.8.486）
# 注意 -universal/-4.8.3345 那类是 NeoForge 版，加载会 ClassNotFound net.neoforged.*
twilight_forest_cf_file=8749067


## Version Ranges（展开进 fabric.mod.json）
# Fabric 版本谓词支持 >=、<、~、* 等
minecraft_version_range=>=1.21.1 <1.21.2
fabric_loader_version_range=>=0.16.0
fabric_api_version_range=*
# 必需前置（jar-in-jar 内嵌，故一定存在）
json_things_range=>=0.13.7
# AutoSizedGUI 自研库版本形如 1.1.0c，不是合法 SemVer，Fabric 无法比较 → 只能放行任意版本
autosizedgui_range=*
# 可选联动（写入 fabric.mod.json 的 recommends）
# jei-1.21.1-fabric-19.53.0.426
jei_range=>=19.53.0
# CyclopsCore / 暮色森林的 Fabric 版本号待确认，先不约束
cyclopscore_range=*
twilight_forest_range=*
