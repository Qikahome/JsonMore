plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.11'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 加载 secret.properties（上级目录，供多个子项目共享）
def secretFile = file('../secret.properties')
if (secretFile.exists()) {
    def secretProps = new Properties()
    secretFile.withInputStream { secretProps.load(it) }
    secretProps.each { key, value -> project.ext.set(key, value) }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }

    // AutoSizedGUI - GitHub Packages
    maven {
        name = "GitHubPackages"
        url = "https://maven.pkg.github.com/Qikahome/AutoSizedGUI"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }

    maven {
        name 'Dogforce Games'
        url 'https://www.dogforce-games.com/maven/'
    }
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name "ModMaven"
        url "https://modmaven.dev"
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // JSON Things - 必需依赖
    implementation "dev.gigaherz.jsonthings:JsonThings-1.21.1:${json_things_version}"

    // AutoSizedGUI - 自动布局GUI（jarjar 嵌入）
    implementation "qikahome:AutoSizedGUI-1.21.1:1.0.8"
    jarJar("qikahome:AutoSizedGUI-1.21.1:1.0.8")

    // JEI - 可选依赖
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade - 可选依赖
    runtimeOnly "curse.maven:jade-324717:6198776"

    // Create - 可选依赖
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // CyclopsCore - 可选依赖（用于滚动容器）
    compileOnly "curse.maven:cyclops-core-232758:5612213"
    runtimeOnly "curse.maven:cyclops-core-232758:5612213"

    // Anvil MusBox - 可选依赖
    compileOnly "blank:Anvil-MusBox-NeoForge-${minecraft_version}:${anvil_musbox_version}"
    runtimeOnly "blank:Anvil-MusBox-NeoForge-${minecraft_version}:${anvil_musbox_version}"

    // 暮色森林（Twilight Forest）- 可选依赖
    compileOnly "curse.maven:the-twilight-forest-227639:5699076"
    runtimeOnly "curse.maven:the-twilight-forest-227639:5699076"

    // Create 也需要运行时
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    // Registrate - Create 的传递依赖
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            jei_range: jei_range,
            json_things_range: json_things_range,
            cyclopscore_range: cyclopscore_range,
            anvil_musbox_range: anvil_musbox_range,
            twilight_forest_range: twilight_forest_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // 从 local.properties 读取输出目录（不提交到 Git）
    def localProps = new Properties()
    def localFile = file('local.properties')
    if (localFile.exists()) {
        localFile.withInputStream { localProps.load(it) }
        def outputDir = localProps.getProperty('build_output_dir')
        if (outputDir) {
            destinationDirectory = file(outputDir)
        }
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
