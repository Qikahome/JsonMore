// JsonMore → Fabric (1.20.1)
// 基线：JsonMore Forge 1.20.1 分支（本目录自 main 分出）；构建配置参考 JsonThings-Fabric-1.20.1 与 JsonMore Fabric1.21.1。
// JsonThings-Fabric 作为 jar-in-jar 内嵌（其内部已自带 FabricatedForgeFluid 与所需 Porting Lib 模块）。
plugins {
    // 版本下限由依赖决定：AutoSizedGUI-1.20.1-fabric（Loom 1.13.6）/ JEI 15.58（Loom 1.17.20）
    // 的 jar 都被 Loom 打了产出方版本号，Loom 拒绝低于构建方的版本，故此处必须 ≥1.17.20
    // （同 JsonMore Fabric1.21.1）。连带 Gradle 9.x 与 Gradle 守护进程 Java 21；
    // 编译 toolchain 仍是 Java 17（MC 1.20.1 的目标版本）。
    id 'fabric-loom' version '1.17.+'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// 加载 secret.properties（上级目录，供多个子项目共享：GitHub Packages 凭据等）
def secretFile = file('../secret.properties')
if (secretFile.exists()) {
    def secretProps = new Properties()
    secretFile.withInputStream { secretProps.load(it) }
    secretProps.each { key, value -> project.ext.set(key, value) }
}

repositories {
    maven {
        // hanbings 第三方代理：镜像 fabricmc/mavenCentral 等，缓解国外源过慢（若失效可移除）
        url project.findProperty('loom_libraries_base') ?: 'https://repository.hanbings.io/proxy/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex '.*'
        }
    }
    mavenCentral()
    maven {
        // Minecraft 运行库（text2speech 等 Mojang 专属，仅发布于官方库）
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://maven.fabricmc.net/"
    }
    maven {
        // Porting Lib 1.20.1 稳定线（2.3.x）
        url "https://mvn.devos.one/releases"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 模块的传递依赖（部分模块 → reach-entity-attributes）
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        // JsonThings-Fabric（GitHub Packages）
        name = "JsonThingsFabric"
        url = "https://maven.pkg.github.com/Qikahome/JsonThings-Fabric"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        // FabricatedForgeFluid（GitHub Packages；JsonThings-Fabric 已内嵌，此处备用）
        name = "FabricatedForgeFluid"
        url = "https://maven.pkg.github.com/Qikahome/FabricatedForgeFluid"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        // 上游 JsonThings 的脚本引擎 rhino-lib（dev.gigaherz.rhinolib，JsonThings-Fabric 的传递依赖）
        url "https://www.dogforce-games.com/maven/"
        content {
            includeGroup "dev.gigaherz.rhinolib"
        }
    }
    maven {
        // Rhino Fabric 版（JsonThings-Fabric 的传递依赖：maven.modrinth:rhino）
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenLocal()   // 自有库的本地发布产物（AutoSizedGUI 等）
    maven {
        // AutoSizedGUI（GitHub Packages）
        name = "AutoSizedGUI"
        url = "https://maven.pkg.github.com/Qikahome/AutoSizedGUI"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        // CurseForge Maven（可选联动模组：JEI）
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    // mojmap（官方映射），与上游 Forge 侧一致，源码可直接编译；不用 parchment（下载慢）
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

    // JSON Things Fabric：必需前置，jar-in-jar 内嵌
    // （其 jar 内已 include FabricatedForgeFluid 与 base/common/fluids/models/tool_actions/transfer 等 Porting Lib 模块）
    modImplementation(include("qikahome:JsonThings-1.20.1-fabric:${project.property('json_things_version')}"))

    // Porting Lib：仅编译期 classpath（运行时由 JsonThings-Fabric 内嵌提供，故不 include）。
    // 2.3.x 不提供 DeferredRegister/DeferredHolder，注册用本仓库自带的极简实现（lib/registration）。
    def portingLibVersion = project.property('porting_lib_version')
    def portingLibModules = [
            'base', 'common', 'fluids', 'models', 'tool_actions', 'transfer'
    ]
    portingLibModules.each { mod ->
        modImplementation("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}")
    }

    // AutoSizedGUI（自有库）：自动布局 GUI，jar-in-jar 内嵌
    // exclude：AutoSizedGUI 的 POM 把它的 dev 运行期依赖（modRuntimeOnly → runtime scope）一并带出，
    // 其中 jei-1.20.1-fabric:15.21.0.148 只在 blamejared maven，本工程解析不到；
    // 且 JEI 版本应由使用方决定。根治办法是 AutoSizedGUI 侧改用 modLocalRuntime（其 fabric/build.gradle）。
    modImplementation(include("qikahome:AutoSizedGUI-${project.property('minecraft_version')}-fabric:${project.property('autosizedgui_version')}")) {
        exclude group: 'mezz.jei', module: 'jei-1.20.1-fabric'
    }

    // ---- 可选联动模组（仅编译期 API + 开发运行期，不打包进产物）----
    // 注意必须用 modCompileOnly/modRuntimeOnly：Curse 上的模组 jar 是 intermediary 命名，
    // 普通 compileOnly 不会重映射，会导致 class_xxxx 找不到符号。
    // JEI（Just Enough Items）
    modCompileOnly "curse.maven:jei-238222:${project.property('jei_cf_file')}"
    modRuntimeOnly "curse.maven:jei-238222:${project.property('jei_cf_file')}"

    // 不接入：CyclopsCore（1.20.1 无 Fabric 版）/ 匠魂 / Create / Anvil MusBox / 暮色森林

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    accessWidenerPath = file("src/main/resources/jsonmore.accesswidener")
    mixin {
        // 固定 refmap 名，不随 archivesName 变化；需与 jsonmore.mixins.json 的 "refmap" 一致，
        // 否则发布环境（intermediary）按此名找不到映射文件而崩溃。
        defaultRefmapName = "jsonmore.refmap.json"
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    var replaceProperties = [
            version                     : project.version,
            mod_id                      : mod_id,
            minecraft_version_range     : minecraft_version_range,
            fabric_loader_version_range : fabric_loader_version_range,
            fabric_api_version_range    : fabric_api_version_range,
            json_things_range           : json_things_range,
            autosizedgui_range          : autosizedgui_range,
            jei_range                   : jei_range
    ]
    inputs.properties replaceProperties

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
