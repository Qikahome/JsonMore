name: Publish (Fabric 1.20.1)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (alpha / beta / release)'
        required: true
        default: 'beta'
  push:
    tags:
      # 加载器后缀：tag 全仓库共享，与 Forge 分支的模式相同会互相触发
      - 'v1.20.1-fabric-*'

env:
  CURSEFORGE_PROJECT_ID: '1570673'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 必须跑在 JVM 21 上：Loom 1.17.20 的插件解析要求 JVM >= 21。
          # 编译目标仍是 Java 17（由 build.gradle 的 toolchain 决定，runner 上自带 JDK 17）。
          java-version: 21
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build
        env:
          # 解析 GitHub Packages 上的 JsonThings-Fabric / AutoSizedGUI（内嵌依赖）
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files-primary: build/libs/!(*-@(dev|sources|javadoc)).jar
          version-type: ${{ inputs.release_type != '' && inputs.release_type || 'beta' }}
          game-versions: |
            1.20.1
          loaders: |
            fabric
          java: |
            17
          changelog-file: CHANGELOG.md
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
