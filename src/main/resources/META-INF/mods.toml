modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Qikahome/JsonMore/issues/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# 模组的主页网址（会展示在模组管理界面中）
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #可选
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JSON Things 依赖 - 强制依赖
[[dependencies.${mod_id}]]
    modId="jsonthings"
    mandatory=true
    versionRange="${json_things_range}"
    ordering="BEFORE"
    side="BOTH"

# JEI（Just Enough Items）依赖 - 可选依赖
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"

# AccessTransformer 配置
[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

# Mantle 核心库依赖 - 可选依赖
[[dependencies.${mod_id}]]
    modId="mantle"
    mandatory=false
    versionRange="${mantle_range}"
    ordering="BEFORE"
    side="BOTH"

# 匠魂（Tinkers' Construct）依赖 - 可选依赖
[[dependencies.${mod_id}]]
    modId="tconstruct"
    mandatory=false
    versionRange="${tconstruct_range}"
    ordering="AFTER"
    side="BOTH"

# Anvil MusBox 依赖 - 可选依赖
[[dependencies.${mod_id}]]
    modId="anvil_musbox"
    mandatory=false
    versionRange="${anvil_musbox_range}"
    ordering="AFTER"
    side="BOTH"

# 暮色森林（Twilight Forest）依赖 - 可选依赖
[[dependencies.${mod_id}]]
    modId="twilightforest"
    mandatory=false
    versionRange="${twilight_forest_range}"
    ordering="AFTER"
    side="BOTH"